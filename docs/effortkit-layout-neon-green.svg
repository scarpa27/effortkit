<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1080" viewBox="0 0 1440 1080" role="img" aria-labelledby="title desc">
<title id="title">Standard clone vs. effortkit: project layout</title>
<desc id="desc">Two layouts of the same project. Left, a standard clone. One checkout holds the Git history, the product code, the plans and the agent setup. Every Kiro session also loads the machine skills and steering in ~/.kiro. Right, effortkit. A shared kit installs one instance per project. The instance is its own repository. It holds a bare clone of the product, one worktree and branch per effort, and a separate worklog repository for plans, inbox and knowledge. It also holds the project rules, the generated agents and skill copies, and a Kiro home that links only the machine settings and MCP servers. An existing clone can replace the bare clone. Colours mark code and workflow. A dashed border marks generated files that git does not track.</desc>
<defs>
      <linearGradient id="canvas" x1="0" y1="0" x2="1" y2="1">
        <stop stop-color="#10151C"/><stop offset="1" stop-color="#080B10"/>
      </linearGradient>
      <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
        <stop stop-color="#111820"/><stop offset="1" stop-color="#0E141C"/>
      </linearGradient>
      <style>
        text { font-family: Arial, Helvetica, sans-serif; fill: #E8EDF4; }
        .eyebrow { font-size: 14px; font-weight: 700; letter-spacing: 2.4px; }
        .title { font-size: 43px; font-weight: 700; letter-spacing: -1.4px; }
        .subtitle { font-size: 20px; fill: #9DA9B9; }
        .heading { font-size: 29px; font-weight: 700; letter-spacing: -0.5px; }
        .body { font-size: 21px; }
        .caption { font-size: 18px; fill: #A0ADBE; }
        .mono { font-family: 'DejaVu Sans Mono', Menlo, Consolas, monospace; font-size: 19px; }
        .root { font-family: 'DejaVu Sans Mono', Menlo, Consolas, monospace; font-size: 21px; font-weight: 700; }
        .pill { font-size: 12px; font-weight: 700; letter-spacing: 0.9px; }
        .small { font-size: 16px; fill: #8E9AAB; }
        .callout { font-size: 23px; font-weight: 700; letter-spacing: -0.3px; }
        .legend { font-size: 16px; fill: #A2AFBF; }
      </style>
    </defs>
